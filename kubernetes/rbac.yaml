apiVersion: v1
kind: ServiceAccount
metadata:
  name: superdeploy-app
  namespace: superdeploy-namespace
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: superdeploy-app-cluster-admin
subjects:
  - kind: ServiceAccount
    name: superdeploy-app
    namespace: superdeploy-namespace
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io